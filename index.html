<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dublin Bike Router</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #01204E;
      --teal: #028391;
      --creme: #F6DCAC;
      --orange-pastel: #FAA968;
      --red-orange: #F85525;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-dark);
      color: var(--creme);
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      padding: 16px;
      background: rgba(1, 32, 78, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(246, 220, 172, 0.2);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      z-index: 1000;
      box-sizing: border-box;
    }

    h3 { margin: 0 0 12px 0; font-size: 18px; font-weight: 700; color: var(--creme); }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      gap: 6px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(246, 220, 172, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: var(--creme);
      font-size: 14px;
      outline: none;
    }

    input::placeholder { color: var(--creme); opacity: 0.6; }

    /* Autocomplete Suggestions Box */
    .suggestions-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: rgba(1, 32, 78, 0.98);
      border: 1px solid rgba(246, 220, 172, 0.3);
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--creme);
      border-bottom: 1px solid rgba(246, 220, 172, 0.1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--teal);
      color: #ffffff;
    }

    .loc-btn {
      width: auto;
      padding: 10px 14px;
      background-color: rgba(2, 131, 145, 0.4);
      color: var(--creme);
      border: 1px solid var(--teal);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: none;
    }

    .loc-btn:hover { background-color: var(--teal); }

    button {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--orange-pastel);
      color: var(--bg-dark);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(250, 169, 104, 0.25);
    }

    button:hover { background-color: var(--creme); }

    .gmaps-btn {
      background-color: transparent;
      border: 1px solid var(--orange-pastel);
      color: var(--orange-pastel);
      margin-top: 8px;
      display: none;
    }

    .gmaps-btn:hover {
      background-color: var(--orange-pastel);
      color: var(--bg-dark);
    }

    #time-summary {
      margin-top: 10px;
      font-weight: bold;
      color: var(--orange-pastel);
      font-size: 14px;
      text-align: center;
      display: none;
    }

    #map { flex: 1; width: 100%; height: 100%; z-index: 1; }

    .leaflet-popup-content-wrapper {
      background: var(--bg-dark) !important;
      color: var(--creme) !important;
      border-radius: 10px !important;
      border: 1px solid rgba(246, 220, 172, 0.2);
    }
    .leaflet-popup-tip { background: var(--bg-dark) !important; }
  </style>
</head>
<body>

  <div id="controls">
    <h3>🚲 Dublin Fast-Route Planner</h3>
    <div class="input-group">
      <div class="input-wrapper">
        <input type="text" id="startInput" placeholder="Start address or place" autocomplete="off">
        <button class="loc-btn" id="locBtn" onclick="useCurrentLocation()">GPS</button>
        <div id="startSuggestions" class="suggestions-box"></div>
      </div>
      <div class="input-wrapper">
        <input type="text" id="endInput" placeholder="Destination address or place" autocomplete="off">
        <div id="endSuggestions" class="suggestions-box"></div>
      </div>
    </div>
    <button id="btn" onclick="planFastestTrip()">Find Fastest Route</button>
    <div id="time-summary"></div>
    <button id="gmapsBtn" class="gmaps-btn" onclick="openGoogleMaps()">🗺️ Export to Google Maps</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([53.3498, -6.2603], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let stations = [];
    let routeLayers = [];
    let userLocation = null;
    let userMarker = null;
    let googleMapsUrl = "";

    // Fetch Live Station Data
    async function fetchStations() {
      try {
        const res = await fetch('https://api.citybik.es/v2/networks/dublinbikes');
        const data = await res.json();
        stations = data.network.stations;

        stations.forEach(s => {
          L.circleMarker([s.latitude, s.longitude], {
            radius: 6,
            color: '#01204E',
            weight: 2,
            fillColor: s.free_bikes > 0 ? '#028391' : '#F85525',
            fillOpacity: 0.9
          }).addTo(map).bindPopup(`<b>${s.name}</b><br>Available Bikes: ${s.free_bikes}<br>Empty Stands: ${s.empty_slots}`);
        });
      } catch (e) {
        console.error('Error fetching bike data:', e);
      }
    }

    // Set Map Location Helper
    function setLocationOnMap(lat, lon, labelText) {
      userLocation = [lat, lon];
      
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker(userLocation, {
        radius: 9,
        color: '#ffffff',
        weight: 3,
        fillColor: '#028391',
        fillOpacity: 1
      }).addTo(map).bindPopup(`<b>${labelText}</b>`).openPopup();

      map.setView(userLocation, 15);

      const startInput = document.getElementById('startInput');
      startInput.value = labelText;
      startInput.dataset.lat = lat;
      startInput.dataset.lon = lon;
    }

    // High-Accuracy Live GPS Integration with Auto-Fallback
    function useCurrentLocation() {
      const locBtn = document.getElementById('locBtn');
      locBtn.innerText = "...";

      // 1. Try Browser HTML5 Geolocation API
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            setLocationOnMap(position.coords.latitude, position.coords.longitude, "My Current Location");
            locBtn.innerText = "GPS";
          },
          (error) => {
            console.warn("Browser GPS failed or blocked. Trying IP fallback...", error);
            fallbackIPLocation();
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      } else {
        fallbackIPLocation();
      }
    }

    // IP-Based Location Fallback
    async function fallbackIPLocation() {
      const locBtn = document.getElementById('locBtn');
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        if (data.latitude && data.longitude) {
          setLocationOnMap(data.latitude, data.longitude, "Estimated Location (IP)");
        } else {
          throw new Error("Invalid IP response");
        }
      } catch (e) {
        alert("GPS disabled or unavailable. Please type your starting location in the search bar.");
      } finally {
        locBtn.innerText = "GPS";
      }
    }

    // Live Typeahead Autocomplete
    function setupAutocomplete(inputId, suggestionsId) {
      const input = document.getElementById(inputId);
      const box = document.getElementById(suggestionsId);
      let debounceTimer = null;

      input.addEventListener('input', () => {
        delete input.dataset.lat;
        delete input.dataset.lon;
        
        clearTimeout(debounceTimer);
        const query = input.value.trim();

        if (query.length < 2) {
          box.innerHTML = '';
          box.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=53.3498&lon=-6.2603&limit=5`;
            const res = await fetch(url);
            const data = await res.json();

            box.innerHTML = '';

            if (!data.features || data.features.length === 0) {
              box.style.display = 'none';
              return;
            }

            data.features.forEach(feature => {
              const p = feature.properties;
              const coords = feature.geometry.coordinates;

              let name = p.name || p.street || p.housenumber || 'Location';
              let city = p.city || p.county || p.state || 'Dublin';
              let label = `${name}${city ? ', ' + city : ''}`;

              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = label;

              div.onclick = () => {
                input.value = label;
                input.dataset.lat = coords[1];
                input.dataset.lon = coords[0];
                box.innerHTML = '';
                box.style.display = 'none';
              };

              box.appendChild(div);
            });

            box.style.display = 'block';
          } catch (e) {
            console.error("Autocomplete error:", e);
          }
        }, 200);
      });
    }

    setupAutocomplete('startInput', 'startSuggestions');
    setupAutocomplete('endInput', 'endSuggestions');

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.input-wrapper')) {
        document.getElementById('startSuggestions').style.display = 'none';
        document.getElementById('endSuggestions').style.display = 'none';
      }
    });

    // Geocoding Engine
    async function geocode(inputElement) {
      if (inputElement.dataset.lat && inputElement.dataset.lon) {
        return [parseFloat(inputElement.dataset.lat), parseFloat(inputElement.dataset.lon)];
      }

      const query = inputElement.value.trim();
      if (!query) throw new Error("Please enter a location");

      const nomUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Dublin, Ireland')}&countrycodes=ie`;
      const res = await fetch(nomUrl);
      const data = await res.json();

      if (data && data.length > 0) {
        return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
      }

      throw new Error(`Location '${query}' not found`);
    }

    // Routing engine
    async function fetchRouteSegment(from, to, mode) {
      const profile = mode === 'bike' ? 'cycling' : 'foot';
      const url = `https://routing.openstreetmap.de/routed-bike/route/v1/${profile}/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      const route = data.routes[0];
      return {
        path: route.geometry.coordinates.map(c => [c[1], c[0]]),
        duration: route.duration
      };
    }

    function getDist(pt, station) {
      return Math.hypot(pt[0] - station.latitude, pt[1] - station.longitude);
    }

    async function planFastestTrip() {
      const btn = document.getElementById('btn');
      const timeBox = document.getElementById('time-summary');
      const gmapsBtn = document.getElementById('gmapsBtn');
      
      btn.innerText = "Calculating fastest route...";
      timeBox.style.display = 'none';
      gmapsBtn.style.display = 'none';

      routeLayers.forEach(layer => map.removeLayer(layer));
      routeLayers = [];

      try {
        const start = await geocode(document.getElementById('startInput'));
        const end = await geocode(document.getElementById('endInput'));

        const pickup = stations
          .filter(s => s.free_bikes > 0)
          .sort((a,b) => getDist(start, a) - getDist(start, b))[0];

        const dropoff = stations
          .filter(s => s.empty_slots > 0)
          .sort((a,b) => getDist(end, a) - getDist(end, b))[0];

        if (!pickup || !dropoff) {
          alert("No available stations found nearby.");
          return;
        }

        const pLoc = [pickup.latitude, pickup.longitude];
        const dLoc = [dropoff.latitude, dropoff.longitude];

        const w1 = await fetchRouteSegment(start, pLoc, 'foot');
        const b  = await fetchRouteSegment(pLoc, dLoc, 'bike');
        const w2 = await fetchRouteSegment(dLoc, end, 'foot');

        const l1 = L.polyline(w1.path, { color: '#FAA968', weight: 4 }).addTo(map);
        const l2 = L.polyline(b.path,  { color: '#F85525', weight: 6 }).addTo(map);
        const l3 = L.polyline(w2.path, { color: '#FAA968', weight: 4 }).addTo(map);

        routeLayers.push(l1, l2, l3);
        map.fitBounds(L.featureGroup([l1, l2, l3]).getBounds(), { padding: [60, 60] });

        const totalMins = Math.round((w1.duration + b.duration + w2.duration) / 60);
        timeBox.style.display = 'block';

        googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${start[0]},${start[1]}&destination=${end[0]},${end[1]}&waypoints=${pLoc[0]},${pLoc[1]}%7C${dLoc[0]},${dLoc[1]}&travelmode=bicycling`;
        gmapsBtn.style.display = 'block';

      } catch (e) {
        alert("Search failed. Please pick a suggestion or enter a valid Dublin location.");
        console.error(e);
      } finally {
        btn.innerText = "Find Fastest Route";
      }
    }

    function openGoogleMaps() {
      if (googleMapsUrl) {
        window.open(googleMapsUrl, '_blank');
      }
    }

    fetchStations();
  </script>
</body>
</html>
